# Codemagic CI for GiftKey.
#
# Purpose: build, sign and ship an iOS app without owning a Mac.
#
# Three workflows:
#
#   1. compile-check   No signing, no upload, no Apple account needed. Builds for the
#                      simulator purely to surface compile errors. Runs on every push.
#
#   2. screenshots     Manual only. Captures App Store screenshots from the Simulator.
#
#   3. ios-release     Signs, archives, and uploads to TestFlight. Triggered by pushing
#                      a git tag like `v1.0.0`, so it never fires by accident.
#
# See CI.md for the one-time setup (App Store Connect API key, bundle IDs, App Group).
#
# NOTE ON THE REPEATED vars BLOCKS BELOW
# A YAML anchor was used here originally and it was a trap: `<<: *anchor` does NOT
# deep-merge, so any workflow that declared its own `vars:` silently replaced the
# inherited ones wholesale, leaving XCODE_PROJECT and XCODE_SCHEME empty. That produced
# `xcodebuild -project  -scheme ` and a baffling "'' is not a project file" error.
# The duplication below is deliberate: explicit beats clever for four short lines.

workflows:

  # ---------------------------------------------------------------------------
  # 1. Compile check - no signing, no Apple account required
  # ---------------------------------------------------------------------------
  compile-check:
    name: GiftKey - compile check
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "GiftKey.xcodeproj"
        XCODE_SCHEME: "GiftKey"
    triggering:
      events:
        - push
        - pull_request
    scripts:

      - name: Toolchain versions
        script: |
          xcodebuild -version
          swift --version

      - name: Build app + keyboard extension for simulator
        script: |
          # pipefail is essential: without it the exit status of the pipeline is the
          # formatter's, so a failing xcodebuild would be reported as a GREEN build.
          set -o pipefail
          : "${XCODE_PROJECT:?not set - check this workflow's vars block}"
          : "${XCODE_SCHEME:?not set - check this workflow's vars block}"

          # Fall back to plain output if the log formatter is not on the image.
          if command -v xcbeautify >/dev/null 2>&1; then
            FORMATTER=xcbeautify
          else
            FORMATTER=cat
          fi

          # Code signing is fully disabled: this workflow only answers the question
          # "does it compile?". Entitlements, bundle IDs and the team are all irrelevant
          # here, which is why it runs without any Apple account set up.
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | $FORMATTER

    artifacts:
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          # Build notifications.
          - mgroves5022@outlook.com
        notify:
          success: false   # only shout when it breaks
          failure: true

  # ---------------------------------------------------------------------------
  # 3. App Store screenshots from the iOS Simulator
  # ---------------------------------------------------------------------------
  #
  # Manual-only (no `triggering:` block) - run it from the Codemagic UI when you need
  # fresh screenshots. No signing and no Apple account needed.
  #
  # Captures both device families, because App Store Connect requires iPhone screenshots
  # always and iPad screenshots whenever the app supports iPad (this one does).
  #
  # LIMITATION: the Simulator has NO CAMERA, so only the app's Setup, Scan, Settings and
  # FAQ screens can be captured. The scanner with a barcode in frame - the shot that
  # actually sells a scanner app - needs real hardware. Shoot that by hand on a device
  # and substitute it in as screenshot 2 if you can.
  # ---------------------------------------------------------------------------
  screenshots:
    name: GiftKey - simulator screenshots
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "GiftKey.xcodeproj"
        XCODE_SCHEME: "GiftKey"
        BUNDLE_ID: "com.mattgroves.giftkey"
        # Exactly what App Store Connect accepts. Simulator native resolutions differ
        # by device, so everything is normalised to these at the end.
        IPHONE_SIZE: "1284x2778"    # 6.5" iPhone slot
        IPAD_SIZE: "2048x2732"      # 12.9" iPad slot

    scripts:

      - name: Build for simulator
        script: |
          set -o pipefail
          : "${XCODE_PROJECT:?not set - check this workflow's vars block}"
          : "${XCODE_SCHEME:?not set - check this workflow's vars block}"
          xcodebuild             -project "$XCODE_PROJECT"             -scheme "$XCODE_SCHEME"             -sdk iphonesimulator             -configuration Debug             -derivedDataPath build             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             build

      - name: Capture both device families
        script: |
          set -e

          ROOT="${CM_BUILD_DIR:-$PWD}"
          APP=$(find "$ROOT/build/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "ERROR: no .app produced by the build step"; exit 1; }
          echo "App: $APP"

          # Largest available simulator of each family. A Pro Max / iPad Pro has the
          # closest native aspect to the App Store slots, so the final resize distorts
          # least.
          python3 - > /tmp/giftkey-devices.txt <<'PY'
          import json, subprocess, sys
          raw = subprocess.run(["xcrun", "simctl", "list", "devices", "available", "-j"],
                               capture_output=True, text=True).stdout
          phone = pad = None
          for runtime, devices in json.loads(raw)["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  name = d["name"]
                  if name.startswith("iPhone"):
                      score = 3 if "Pro Max" in name else 2 if "Plus" in name else 1
                      if phone is None or score > phone[0]:
                          phone = (score, d["udid"], name)
                  elif name.startswith("iPad"):
                      score = 3 if "Pro" in name else 2 if "Air" in name else 1
                      if pad is None or score > pad[0]:
                          pad = (score, d["udid"], name)
          if phone is None:
              sys.exit("No iPhone simulator available on this image")
          parts = [phone[1], phone[2].replace(" ", "_")]
          parts += [pad[1], pad[2].replace(" ", "_")] if pad else ["", "none"]
          print(" ".join(parts))
          PY
          read PHONE_UDID PHONE_NAME PAD_UDID PAD_NAME < /tmp/giftkey-devices.txt

          echo "iPhone: $PHONE_NAME ($PHONE_UDID)"
          echo "iPad:   $PAD_NAME ($PAD_UDID)"

          capture_family () {
            UDID="$1"; OUTDIR="$2"; GEOMETRY="$3"
            [ -n "$UDID" ] || { echo "skipping $OUTDIR - no simulator"; return 0; }

            mkdir -p "$OUTDIR"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b

            # A tidy status bar. Cosmetic, but 14% battery on a product page looks
            # careless.
            xcrun simctl status_bar "$UDID" override               --time "9:41" --batteryState charged --batteryLevel 100               --cellularBars 4 --wifiBars 3 || true

            xcrun simctl install "$UDID" "$APP"

            i=1
            for TAB in setup scan settings faq; do
              OUT="$OUTDIR/$(printf '%02d' $i)-$TAB.png"
              # -GiftKeyScreenshotTab lands in UserDefaults' argument domain, which
              # RootView reads. The scan tab does NOT open the camera unless launched
              # from the keyboard, so it is safe to capture here.
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -GiftKeyScreenshotTab "$TAB"
              sleep 6
              xcrun simctl io "$UDID" screenshot "$OUT"
              [ -s "$OUT" ] || { echo "ERROR: $OUT was not written"; exit 1; }
              W="${GEOMETRY%x*}"; H="${GEOMETRY#*x}"
              sips -z "$H" "$W" "$OUT" --out "$OUT" > /dev/null
              echo "  $(basename "$OUT") -> ${W}x${H}"
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
              i=$((i + 1))
            done

            xcrun simctl shutdown "$UDID" || true
          }

          capture_family "$PHONE_UDID" "$ROOT/screenshots/iphone" "$IPHONE_SIZE"
          capture_family "$PAD_UDID"   "$ROOT/screenshots/ipad"   "$IPAD_SIZE"

          echo ""
          find "$ROOT/screenshots" -name '*.png' | sort

    artifacts:
      - screenshots/**/*.png

    publishing:
      email:
        recipients:
          - mgroves5022@outlook.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 2. Signed release to TestFlight
  # ---------------------------------------------------------------------------
  ios-release:
    name: GiftKey - TestFlight release
    instance_type: mac_mini_m2
    max_build_duration: 60

    # This string must match the integration name you create in
    # Codemagic > Teams > Integrations > App Store Connect, character for character.
    integrations:
      app_store_connect: GiftKey ASC Key

    environment:
      xcode: latest
      # Encrypted variable group holding CERTIFICATE_PRIVATE_KEY - the RSA key the
      # signing certificate is issued against. See CI.md > "Signing certificate".
      # Apple never stores private keys, so a certificate created on some other machine
      # is unusable here: without this, fetch-signing-files fails with
      # "Cannot save Signing Certificates without certificate private key".
      groups:
        - signing
      vars:
        XCODE_PROJECT: "GiftKey.xcodeproj"
        XCODE_SCHEME: "GiftKey"
        # Must match AppConstants.swift and both entitlements files.
        BUNDLE_ID: "com.mattgroves.giftkey"
        KEYBOARD_BUNDLE_ID: "com.mattgroves.giftkey.keyboard"

    # Only fires on a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:

      - name: Refuse to ship placeholders
        script: |
          # Cheap guard that saves a 10 minute build and a confusing signing error.
          if grep -rq "PLACEHOLDER" Shared/AppConstants.swift \
                                    GiftKey/GiftKey.entitlements \
                                    GiftKeyKeyboard/GiftKeyKeyboard.entitlements; then
            echo "ERROR: PLACEHOLDER values are still present."
            echo "Replace the bundle ID prefix and App Group before releasing."
            echo "See README.md > 'Renaming / re-signing'."
            exit 1
          fi
          echo "No placeholders found."

      - name: Fetch signing files for BOTH bundle IDs
        script: |
          set -e
          : "${CERTIFICATE_PRIVATE_KEY:?not set - add it to the 'signing' variable group, see CI.md}"

          keychain initialize

          # --certificate-key is what makes this work. Apple stores certificates but
          # never private keys, so any certificate created elsewhere cannot be used
          # here. Passing our own key lets the CLI issue (or reuse) a certificate it
          # can actually sign with.
          #
          # A keyboard extension is a separate App ID and needs its own provisioning
          # profile. Fetching only the app's profile is the classic failure here.
          for ID in "$BUNDLE_ID" "$KEYBOARD_BUNDLE_ID"; do
            echo "Fetching signing files for $ID"
            app-store-connect fetch-signing-files "$ID" \
              --type IOS_APP_STORE \
              --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
              --create
          done

      - name: Show what the profiles actually grant
        script: |
          # Diagnostic. Xcode's "doesn't support the ... App Group" error says what the
          # profile lacks but never what it has, which makes the portal side guesswork.
          # This decodes each fetched profile and prints its real entitlements.
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          shopt -s nullglob
          for p in "$PROFILE_DIR"/*.mobileprovision; do
            security cms -D -i "$p" > /tmp/profile.plist 2>/dev/null || continue
            echo "=================================================================="
            /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist 2>/dev/null
            echo "  app id:     $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/profile.plist 2>/dev/null)"
            echo "  app groups:"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" \
              /tmp/profile.plist 2>/dev/null \
              || echo "    NONE - the App Group is not assigned to this App ID on the portal"
          done
          echo "=================================================================="
          echo "The entitlements files require:"
          grep -A2 "application-groups" GiftKey/GiftKey.entitlements | grep string
          grep -A2 "application-groups" GiftKeyKeyboard/GiftKeyKeyboard.entitlements | grep string

      - name: Add certificates to keychain
        script: |
          set -e
          keychain add-certificates

      - name: Apply profiles to the Xcode project
        script: |
          # Rewrites DEVELOPMENT_TEAM and the provisioning profile on both targets, so
          # the PLACEHOLDERTEAMID in the checked-in project is replaced at build time.
          xcode-project use-profiles

      - name: Build and archive
        script: |
          : "${XCODE_PROJECT:?not set - check this workflow's vars block}"
          : "${XCODE_SCHEME:?not set - check this workflow's vars block}"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CODE_SIGN_STYLE=Manual CURRENT_PROJECT_VERSION=$PROJECT_BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/xcarchive/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight. It does NOT submit for App Store review - that stays a
        # deliberate button press in App Store Connect.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          # Build notifications.
          - mgroves5022@outlook.com
        notify:
          success: true
          failure: true
